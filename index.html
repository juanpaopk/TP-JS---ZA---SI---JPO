<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

</head>
<body>

    <h2>Contáctanos</h2>
    
    <form id="miFormulario" novalidate>
        <!-- Los primeros 3 campos son obligatorios -->
        <div class="form-group">
            <label for="nombre">Nombre (mínimo 3 caracteres)*</label>
            <input type="text" id="nombre" name="nombre" required minlength="3">
            <div id="errorNombre" class="error">El nombre debe tener al menos 3 caracteres.</div>
        </div>

        <div class="form-group">
            <label for="apellido">Apellido *</label>
            <input type="text" id="apellido" name="apellido" required>
            <div id="errorApellido" class="error">El apellido es obligatorio.</div>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico *</label>
            <input type="email" id="email" name="email" required>
            <div id="errorEmail" class="error">Ingrese un correo válido y sin espacios.</div>
        </div>

        <!-- Campos opcionales -->
        <div class="form-group">
            <label for="asunto">Asunto </label>
            <input type="text" id="asunto" name="asunto">
        </div>

        <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <input type="text" id="mensaje" name="mensaje">
        </div>

        <form action="tu_script.php" method="POST">
        <!-- Validación de reCaptcha -->
        <div class="g-recaptcha" data-sitekey="6LdGlPotAAAAAODOV6od_FUJC3PWlCAmShVF1QF0"></div>
        <button type="submit">Enviar</button>
        </form>


        <button type="submit">Enviar</button>
    </form>

</body>
</html>
